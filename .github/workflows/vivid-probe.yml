name: vivid probe

on:
  push:
    branches: [ci/l14-vivid-in-ci]

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Install the kernel's extra modules and load vivid
        run: |
          set -x
          time sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          modinfo vivid | head -3
          sudo modprobe vivid n_devs=1 node_types=0x1
          ls -la /dev/video*

      - name: What the node reports
        run: |
          sudo apt-get install -y v4l-utils
          v4l2-ctl -d /dev/video0 --all | head -40
          echo "--- formats ---"
          v4l2-ctl -d /dev/video0 --list-formats-ext | head -20

      - name: Can a container see it and capture
        run: |
          docker run --rm --device /dev/video0 ubuntu:22.04 ls -la /dev/video0
